<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encabezados</title>
</head>
<body>
  <h1>Encabezados</h1>
  <p>Se usan para organizar por temas o apartados el contenido de una página.</p>
  <p>Habitualmente, se tiene un h1 por página y puede haber varios h2...h6</p>
  
  <h1>Encabezado 1</h1>
  <h2>Encabezado 2</h2>
  <h3>Encabezado 3</h3>
  <h4>Encabezado 4</h4>
  <h5>Encabezado 5</h5>
  <h6>Encabezado 6</h6>

  <p>Se debe intentar evitar colocar más de un h1 por página.</p>
  
</body>
</html>
